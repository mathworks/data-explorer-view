<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" />
    <title>Served folder · data-explorer-view gallery</title>
  </head>
  <body>
    <main class="split three">
      <aside class="pane left" aria-label="Folder">
        <h2>Folder</h2>
        <dex-hierarchy id="folder" label="Served folder"></dex-hierarchy>
      </aside>
      <section class="stage" id="stage">
        <div class="toolbar" id="toolbar"><span id="shown">Choose a file in the folder.</span></div>
      </section>
      <aside class="pane" aria-label="Events">
        <h2>Opened</h2>
        <ol id="event-log" aria-live="polite"></ol>
      </aside>
    </main>
    <script type="module" src="./src/pages/folder.ts"></script>
  </body>
</html>
