# Continuous integration: leak check, typecheck (the model also without a DOM), import
# boundaries, that the committed dist/ is the build of src/, and the unit tests; and,
# alongside, the VS Code extension's own checks run against this view, and the widgets in
# three browser engines. Runs on every push to main and on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Checking out is the only thing the token is for here: this workflow writes nothing
# back — no comment, no commit, no release. Spelled out rather than left to the
# repository default, which a settings change could widen without anyone touching a
# workflow file.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # No later step uses git with the token, so checkout does not keep it. The whole history,
      # for its tags: the API check compares with the latest release.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Before `npm ci`, deliberately: the check needs no dependencies, and a leak
      # should be reported in seconds rather than behind the install. It is also the
      # one check whose failure cannot be fixed by retrying.
      - name: Leak check
        run: npm run check:leak

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # src/ may import only itself, data-explorer-core and lit; src/model neither lit
      # nor a widget.
      - name: Import boundaries
        run: npm run check:boundary

      # dist/ is committed and is what a consumer runs (see .gitignore), so it must be
      # the build of src/. It deletes dist/ first because tsc never deletes an output:
      # built over the committed copy, a file whose source is gone would stay and pass.
      # The build also writes custom-elements.json and the API half of each
      # docs/widgets/ page from the widgets' source, so they are held to the same rule.
      # The status line prints every file that differs; it prints nothing when they
      # match. To fix a red: rm -rf dist && npm run build, then commit what it changed.
      - name: dist/, the manifest and the widget docs are the build of src/
        run: |
          rm -rf dist
          npm run build
          git status --porcelain --untracked-files=all -- dist custom-elements.json docs/widgets
          git diff --exit-code --stat -- dist custom-elements.json docs/widgets
          test -z "$(git status --porcelain --untracked-files=all -- dist custom-elements.json docs/widgets)"

      # The public API against the latest v* tag: an export, a widget's member, attribute or
      # event, a detail's or a wire message's field, a token or an icon that is gone (a detail
      # or a message changed) fails unless package.json's version is a major bump over the
      # tag's. See scripts/check-api.mjs.
      - name: API against the last release
        run: npm run check:api

      - name: Unit tests
        run: npm test

  # The VS Code extension (mathworks/data-explorer-vscode) is the first consumer of this
  # package, and a change here must not regress it. So this job runs the extension's
  # typecheck, builds and unit tests, its golden payloads among them, against this view
  # in place of the one it pins. A change that breaks the extension on purpose comes with
  # a vscode branch of the same name that adapts the extension to it: the job tests that
  # branch when there is one, and the extension's main otherwise.
  #
  # Not a required check: its result also depends on another repository, which a pull
  # request here cannot fix. After a breaking change merges, the push run on main is red
  # until the extension's adaptation reaches its main. The extension's integration suite
  # is left out: it launches VS Code under a virtual display, takes minutes and has a
  # known flake; the extension's CI runs it on the pull request that moves the pin.
  downstream-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: view
          persist-credentials: false

      # The branch is passed in through env, not written into the script: whoever opens a
      # pull request names its branch, and an expression is pasted into the script as text
      # before the shell parses it. --exit-code makes ls-remote exit 2 when no branch
      # matches; any other failure is a failed lookup, which fails the job rather than
      # quietly testing main.
      - name: Choose the extension's branch
        id: vscode-ref
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          status=0
          git ls-remote --exit-code --heads \
            https://github.com/mathworks/data-explorer-vscode.git "refs/heads/$BRANCH" || status=$?
          case $status in
            0) ref=$BRANCH; why="it has a branch named $BRANCH" ;;
            2) ref=main; why="it has no branch named $BRANCH" ;;
            *) exit "$status" ;;
          esac
          echo "::notice title=Extension branch::data-explorer-vscode $ref, as $why"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # With its history, for the report of what changed in the files view copies from it.
      - uses: actions/checkout@v7
        with:
          repository: mathworks/data-explorer-vscode
          ref: ${{ steps.vscode-ref.outputs.ref }}
          path: vscode
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      # As the extension's CI installs it: core and view by git, at its lockfile's commits.
      - name: Install the extension's dependencies
        working-directory: vscode
        run: npm ci

      # What the extension would get from this commit: the files npm packs (the committed
      # dist/ and the theme), with no script run, as an install by git under ignore-scripts
      # gets them. --no-save keeps the extension's package.json and lockfile as they are;
      # its test/viewPin.test.ts reads the pin there and leaves what is installed alone.
      - name: Install this view over the extension's pin
        run: |
          tarball=$(cd view && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -n 1)
          cd vscode
          npm install --no-save --ignore-scripts "$RUNNER_TEMP/$tarball"

      # Every later step tests this view only if it is the one installed. An install that
      # kept the pinned view would make each of them a test of the pin, green for the wrong
      # reason.
      - name: The installed view is this one
        run: diff -r view/dist vscode/node_modules/data-explorer-view/dist

      # The editing messages of view's wire, and the modules view copied from the extension (its
      # transfer, registers and deleters), each held to the extension's own declaration of it,
      # both ways round: compiled inside the extension's checkout, against this view. A message or
      # a type that drifted fails to compile, on its line of scripts/downstream/view-wire.check.ts.
      # The two files are copied to the checkout's root, where no other step looks.
      - name: The editing wire and the copies are the extension's
        run: |
          cp view/scripts/downstream/view-wire.check.ts view/scripts/downstream/tsconfig.view-wire.json vscode/
          cd vscode
          npx tsc -p tsconfig.view-wire.json

      # Which of the extension's files view copies have changed there since each copy was taken:
      # warnings to read, never a failure (scripts/copied-drift.mjs).
      - name: Copies behind the extension (a report)
        continue-on-error: true
        run: node view/scripts/copied-drift.mjs vscode

      - name: Typecheck the extension
        working-directory: vscode
        run: npm run typecheck

      # vite bundles the widgets into the webview, and esbuild the model into the host, for
      # the desktop and the web extension. Before the unit tests, as in the extension's CI:
      # one of them reads the built webview, and passes without looking when there is none.
      - name: Build the extension (desktop + web)
        working-directory: vscode
        run: |
          npm run build
          npm run build:web

      # Under CI, vitest fails on a snapshot it does not have rather than writing it, so a
      # golden payload that changed or went missing is red. Actions sets CI already; it is
      # spelled out because the goldens depend on it.
      - name: The extension's unit tests, goldens included
        working-directory: vscode
        env:
          CI: '1'
        run: npx vitest run

  # The widgets in real browsers. The gallery (gallery/) is a Vite app that imports this
  # package as an app does, through its public entries; its tests load every page and use
  # each widget with the mouse and the keyboard, in Chromium, Firefox and WebKit against the
  # build, and in Chromium against Vite's dev server. They check behaviour, never pixels, so
  # one expectation holds in every engine.
  #
  # Not a required check, like downstream-vscode: a new browser release can turn it red with
  # no change here.
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The committed dist/, not a fresh build of src/: dist/ is what an app installs, and
      # build-and-test checks that it is the build of src/. The pages are typechecked against
      # its declarations first.
      - name: Build the gallery
        run: npm run gallery:build

      # The browsers of the Playwright version in the lockfile, and the system libraries
      # they need.
      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser tests (Chromium, Firefox, WebKit)
        run: npm run test:gallery

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-report
          path: |
            gallery/playwright-report/
            gallery/test-results/
          retention-days: 7
          if-no-files-found: ignore
